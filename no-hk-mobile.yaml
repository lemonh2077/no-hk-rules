# no-hk-mobile.yaml
# 手机代理覆写文件：复用订阅已有的 DirectACCESS，避免重复代理组
# 适用于 Mihomo/Clash Meta 类客户端

+rules:
  # 达梦数据库直连，避免 TUN 开启后数据库连接被代理接管
  - AND,((IP-CIDR,19.25.34.81/32,no-resolve),(DST-PORT,15236)),DIRECT
  - IP-CIDR,19.25.34.81/32,DIRECT,no-resolve
  - AND,((IP-CIDR,19.25.36.128/32,no-resolve),(DST-PORT,5236)),DIRECT
  - IP-CIDR,19.25.36.128/32,DIRECT,no-resolve
  - AND,((IP-CIDR,19.15.75.180/32,no-resolve),(DST-PORT,8581)),DIRECT
  - IP-CIDR,19.15.75.180/32,DIRECT,no-resolve
  - AND,((IP-CIDR,19.25.34.84/32,no-resolve),(DST-PORT,5237)),DIRECT
  - IP-CIDR,19.25.34.84/32,DIRECT,no-resolve

  # OpenAI / Codex 相关规则：走代理，但不会走香港
  - DOMAIN-SUFFIX,openai.com,DirectACCESS
  - DOMAIN-SUFFIX,chatgpt.com,DirectACCESS
  - DOMAIN-SUFFIX,oaistatic.com,DirectACCESS
  - DOMAIN-SUFFIX,oaiusercontent.com,DirectACCESS
  - DOMAIN-SUFFIX,openaiapi-site.azureedge.net,DirectACCESS
  - DOMAIN-SUFFIX,auth0.com,DirectACCESS

  # 国内政务 / 日常规则：直连
  - DOMAIN-SUFFIX,gdgov.cn,DIRECT
  - DOMAIN-SUFFIX,gov.cn,DIRECT
  - DOMAIN-SUFFIX,data.gdgov.cn,DIRECT
  - DOMAIN-SUFFIX,quark.cn,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,xunlei.com,DIRECT
  - IP-CIDR,19.25.34.77/32,DIRECT
  - IP-CIDR,19.25.34.83/32,DIRECT
  - IP-CIDR,19.25.34.86/32,DIRECT

  # MiniMax API 直连
  - DOMAIN-SUFFIX,minimaxi.com,DIRECT
  - DOMAIN-SUFFIX,minimax.com,DIRECT

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - system
    - 114.114.114.114
  fake-ip-filter:
    - +.lan
    - +.local
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
  proxy-server-nameserver:
    - system
    - 114.114.114.114
  direct-nameserver:
    - system
    - 114.114.114.114
